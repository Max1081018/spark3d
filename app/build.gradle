plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.spark3d'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.spark3d'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // Installs directly: the debug keystore needs no setup.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so test builds install without keystores
            // in CI. Replace with a real signing config before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

// Deliberately zero dependencies. No AndroidX, no Compose, no support library:
// the APK is the game, the engine and the system APIs it is built on.
dependencies {
}
